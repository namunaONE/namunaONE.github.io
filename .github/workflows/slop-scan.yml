name: Slop Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  slop-scan:
    name: Namuna Slop Scan (static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run slop-scan
        run: node .opencode/skills/namuna-guardian/scripts/slop-scan.mjs .

      - name: Check for expired waivers
        run: |
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('.hallmark/waivers.jsonl','utf8').split('\n').filter(Boolean);
            const today = new Date().toISOString().slice(0,10);
            let expired = 0;
            for (const l of lines) {
              const w = JSON.parse(l);
              if (w.expires && w.expires < today) { console.log('EXPIRED:', w.id, w.expires); expired++; }
            }
            if (expired > 0) { console.error(expired + ' expired waiver(s) found'); process.exit(1); }
            console.log('All waivers current (none expired).');
          "

  verify-live:
    name: Namuna Live Verification (figures + links)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run verify-live
        run: node .opencode/skills/namuna-guardian/scripts/verify-live.mjs index.html