name: guardian

# Namuna Design Guardian — anti-slop + integrity + live verification + gated deploy.
#
# Flow: guard (static gates, scanner self-test, gate-coverage, flow check,
#       skill lint, live checks) -> deploy (GitHub Pages).
# PRs and the weekly cron run the guard only; pushes to main additionally
# deploy, so a failing gate means a no-deploy, not a tripwire.
#
# Requires: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# (User sites with the .github.io name default to branch deploy; flip it once.)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly drift check — Mondays 03:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static gates (slop-scan)
        run: node .opencode/skills/namuna-guardian/scripts/slop-scan.mjs .

      - name: Scanner self-test (fixture pairs)
        run: node .opencode/skills/namuna-guardian/scripts/self-test.mjs

      - name: Gate coverage audit (claims vs code)
        run: node .opencode/skills/namuna-guardian/scripts/gate-coverage.mjs

      - name: Flow integrity (specs, build log, waivers)
        run: node scripts/flow.mjs check

      - name: Skill lint (structure, paths, gate ranges)
        run: node scripts/skill-lint.mjs

      - name: SLO check (error budget vs targets)
        run: node scripts/slo-check.mjs

      - name: Launch readiness (pre-ship checklist)
        run: node scripts/launch-check.mjs

      - name: Accessibility CI (A6 focus, A13 hero fold, A16 placeholders, contrast)
        run: node scripts/a11y-check.mjs

      - name: Performance budget (Lighthouse CI)
        run: node scripts/lighthouse-check.mjs http://localhost:4174

      - name: Live verification (links A20 + figure drift A19)
        run: node .opencode/skills/namuna-guardian/scripts/verify-live.mjs index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
