name: guardian

# Namuna Design Guardian — anti-slop + live-source verification + gated deploy.
#
# Flow: guard (slop-scan A1–A18 · verify-live A19/A20) → deploy (GitHub Pages).
# PRs and the weekly cron run the guard only; pushes to main additionally
# deploy, so a failing gate now means a no-deploy, not a tripwire.
#
# Requires: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# (User sites with the .github.io name default to branch deploy; flip it once.)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly drift check — Mondays 03:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static floor (slop-scan)
        run: node .opencode/skills/namuna-guardian/scripts/slop-scan.mjs .

      - name: Live verification (links A20 + figure drift A19)
        run: node .opencode/skills/namuna-guardian/scripts/verify-live.mjs index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5